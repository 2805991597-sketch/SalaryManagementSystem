logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} : %msg%n"
  config: classpath:logback-spring.xml
  level:
    com.example.mapper: DEBUG
    org.mybatis: DEBUG

